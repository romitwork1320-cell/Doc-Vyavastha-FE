<div class="dialog-header p-24 d-flex align-items-center justify-content-between border-bottom" style="overflow-x: hidden;">
  <h4 class="mat-headline-6 m-0">{{ isEdit ? 'Edit Caste' : 'Create Caste' }}</h4>
  <button class="close-btn" (click)="close()">
    <i-tabler name="x" class="icon-20"></i-tabler>
  </button>
</div>

<mat-dialog-content class="mat-typography" style="padding-top: 16px; overflow-x: hidden;">
  <form [formGroup]="casteForm" class="crm-form">
    <div class="form-group">
      <label>Name <span class="required">*</span></label>
      <input type="text" formControlName="name" class="crm-input" placeholder="Ex: General, OBC, SC, ST">
    </div>
    
    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="description" class="crm-input" placeholder="Description..." rows="3"></textarea>
    </div>

    @if (isEdit) {
      <div class="form-group">
        <label>Status <span class="required">*</span></label>
        <select formControlName="status" class="crm-input">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>
    }
  </form>
</mat-dialog-content>

<div class="dialog-footer">
  <button class="btn-cancel" (click)="close()" [disabled]="isSubmitting">Cancel</button>
  <button class="btn-submit" (click)="onSubmit()" [disabled]="casteForm.invalid || isSubmitting">
    {{ isSubmitting ? 'Saving...' : (isEdit ? 'Update' : 'Create') }}
  </button>
</div>
