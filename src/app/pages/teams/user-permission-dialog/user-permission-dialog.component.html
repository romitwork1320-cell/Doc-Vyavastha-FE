<div class="dialog-header">
  <h2 class="dialog-title">Manage Access</h2>
  <button mat-icon-button class="close-button" (click)="close()">
    <i-tabler name="x" class="icon-20"></i-tabler>
  </button>
</div>

<mat-dialog-content class="dialog-body scrollable-content">
  <div class="user-card">
    <div class="user-icon-wrapper">
      <i-tabler name="user-shield" class="icon-24"></i-tabler>
    </div>
    <div class="user-details">
      <div class="user-name">{{ data.user.username }}</div>
      <div class="user-role">Role: {{ data.user.role }}</div>
    </div>
  </div>

  <p class="helper-text">
    Overrides allow this user to <strong>View</strong> specific pages even if their Role doesn't allow it.
  </p>

  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div *ngIf="!isLoading" class="permissions-grid">
    <div class="permission-item" *ngFor="let page of pages">
      <mat-checkbox 
        color="primary" 
        [checked]="isPageAllowed(page)"
        (change)="togglePermission(page, $event)"
        [disabled]="isToggling === page.pageId">
        <div class="checkbox-label-content">
          <span class="page-name">{{ page.pageName }}</span>
          <span class="page-url">{{ page.routeUrl || '/' }}</span>
        </div>
      </mat-checkbox>
    </div>
  </div>
</mat-dialog-content>

<div class="dialog-footer">
  <button mat-button (click)="close()">Close</button>
</div>
