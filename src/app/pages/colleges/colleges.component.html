<div class="leads-page common-card">
  <!-- Stats & Search Row -->
  <div class="stat-row">
    <div class="stat-chip active">
      All Colleges <span class="chip-count">{{ count() }}</span>
    </div>
    <div style="flex:1"></div>
    <div class="search-box">
      <i-tabler name="search" style="width:16px;height:16px;color:#94a3b8"></i-tabler>
      <input [(ngModel)]="searchQuery" placeholder="Search colleges..." class="search-input"/>
    </div>
  </div>

  <!-- Table Card -->
  <div class="table-card common-content">
    <div class="common-table-container">
      <table class="leads-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Created At</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @if (isLoading) {
            <tr><td colspan="3" class="text-center p-24">Loading...</td></tr>
          } @else {
            <tr *ngFor="let college of filteredColleges" class="table-row">
              <td>
                <div style="font-weight: 600; font-size: 14px; color: #0f172a;">{{ college.name }}</div>
              </td>
              <td><div style="color: #64748b; font-size: 13px;">{{ college.createdAt | date:'mediumDate' }}</div></td>
              <td>
                <div class="action-btns">
                  <button class="icon-btn" title="Edit" (click)="openDialog(college)" *ngIf="authService.hasPermission('/colleges', 'CanEdit')">
                    <i-tabler name="pencil" style="width:15px;height:15px"></i-tabler>
                  </button>
                  <button class="icon-btn" title="Delete" (click)="deleteItem(college.id)" *ngIf="authService.hasPermission('/colleges', 'CanDelete')">
                    <i-tabler name="trash" class="text-red" style="width:15px;height:15px"></i-tabler>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
      
      @if (!isLoading && filteredColleges.length === 0) {
        <div class="empty-state">
          <i-tabler name="mood-empty" style="width:40px;height:40px;color:#cbd5e1"></i-tabler>
          <p>No colleges found.</p>
        </div>
      }
    </div>
  </div>
</div>
