<h2 class="f-w-500" mat-dialog-title><strong>{{action}} Image</strong></h2>
@if(action === 'Add') {
  <mat-dialog-content class="p-t-10" style="max-width: 600px;">
    <form #publicityForm="ngForm">
      <div class="row">
        <div class="col-lg-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Title</mat-label>
            <input type="text" matInput required id="title" name="title" [(ngModel)]="local_data.title" placeholder="Image Title" />
            <mat-error *ngIf="publicityForm.controls['title']?.errors?.['required'] && publicityForm.controls['title']?.touched">
              Title is required.
            </mat-error>
          </mat-form-field>
        </div>
        <div class="col-lg-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Link (URL)</mat-label>
            <input type="url" matInput id="link" name="link" [(ngModel)]="local_data.link" placeholder="https://example.com" />
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Image File</mat-label>
            <input matInput [disabled]="true" [value]="selectedFile?.name || ''" placeholder="No file selected">
            <button mat-icon-button matSuffix color="primary" (click)="fileInput.click()">
              <mat-icon>attach_file</mat-icon>
            </button>
            <input #fileInput type="file" (change)="onFileSelected($event)" required style="display: none;"/>
          </mat-form-field>
          <mat-error *ngIf="!selectedFile && publicityForm.submitted" class="m-l-10">
            File is required.
          </mat-error>
        </div>
      </div>
      <div mat-dialog-actions class="d-flex justify-content-end p-0">
        <button mat-flat-button color="primary" [disabled]="!publicityForm.valid || !selectedFile || isSubmitting" (click)="doAction('Add')">
          @if (isSubmitting) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            <span>Upload</span>
          }
        </button>
        <button mat-stroked-button color="warn" class="m-l-8" (click)="closeDialog()">
          Cancel
        </button>
      </div>
    </form>
  </mat-dialog-content>
} @else if (action === 'Delete') {
  <div class="p-x-24">
    <p>Are you sure you want to delete the image titled "<span class="f-w-600">{{ local_data.title }}</span>"? This action cannot be undone.</p>
  </div>
  <div mat-dialog-actions class="p-x-24 p-b-24 d-flex justify-content-end">
    <button mat-flat-button color="warn" [disabled]="isSubmitting" (click)="doAction('Delete')">
      @if (isSubmitting) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        <span>Delete</span>
      }
    </button>
    <button mat-button (click)="closeDialog()" class="m-l-8">Cancel</button>
  </div>
}
