<mat-card class="cardWithShadow common-card">
  <mat-card-content class="table-card-content common-content">
    
    @if (isLoading && !products.length) {
      <div class="loading-spinner">
        <mat-spinner diameter="50"></mat-spinner>
        <p>Loading products...</p>
      </div>
    } @else {
      <div class="table-container common-table-container" #tableContainer (scroll)="onScroll($event)">
        
        <table mat-table [dataSource]="dataSource" class="w-100" matSort>
          
          <ng-container matColumnDef="#">
            <th mat-header-cell *matHeaderCellDef class=" f-w-600">#</th>
            <td mat-cell *matCellDef="let element; let i = index;">{{ i + 1 }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="name" class=" f-w-600">Name</th>
            <td mat-cell *matCellDef="let element">
              {{ element.name }}
            </td>
          </ng-container>

          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class=" f-w-600 text-right p-r-24">Action</th>
            
            <td mat-cell *matCellDef="let element" class="action-link mobile-action-drawer">
              
              <div class="desktop-actions">
                
                <div class="hover-actions">
                  <a (click)="$event.stopPropagation(); openDialog('Delete', element)" 
                     class="cursor-pointer text-error" 
                     matTooltip="Delete Product">
                     <i-tabler name="trash" class="icon-22"></i-tabler>
                  </a>
                </div>
                
                <button mat-icon-button [matMenuTriggerFor]="actionMenu" (click)="$event.stopPropagation()">
                  <i-tabler name="dots-vertical" class="icon-18"></i-tabler>
                </button>
                
                <mat-menu #actionMenu="matMenu" xPosition="before">
                  <button mat-menu-item (click)="openDialog('Update', element)">
                    <i-tabler name="edit" class="icon-18 m-r-8 text-primary"></i-tabler><span>Edit</span>
                  </button>
                  <button mat-menu-item (click)="openDialog('Delete', element)">
                    <i-tabler name="trash" class="icon-18 m-r-8 text-error"></i-tabler><span>Delete</span>
                  </button>
                </mat-menu>
              </div>

              <div class="mobile-drawer-content">
                <a (click)="$event.stopPropagation(); openDialog('Delete', element)" class="mobile-action-btn delete">
                  <i-tabler name="trash" class="icon-18"></i-tabler>
                </a>
              </div>

            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" 
              class="mobile-swipe-row"
              [class.mobile-swipe-active]="swipedProductId === row.id"
              (click)="openDialog('Update', row)"
              
              appSwipeable
              (swipeLeft)="onSwipe(row.id, 'open')"
              (swipeRight)="onSwipe(row.id, 'close')">
          </tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell text-center" [attr.colspan]="displayedColumns.length">
              <div class="p-24 d-flex flex-column align-items-center justify-content-center">
                <p class=" m-0">
                  No products found
                  <ng-container *ngIf="filterValue">
                    matching "<strong>{{ filterValue }}</strong>"
                  </ng-container>
                </p>
              </div>
            </td>
          </tr>
        </table>
        
        @if (isLoading) {
          <div class="text-center p-24">
            <mat-spinner diameter="30"></mat-spinner>
          </div>
        }
      </div>
    }
  </mat-card-content>
</mat-card>
