<div class="p-24">
<div class="zenxius-card">
  <div class="p-x-24 p-y-16 d-flex justify-content-between align-items-center border-bottom">
    <h4 class="f-w-600 m-b-0 m-t-0 f-s-18 text-dark">Application Templates</h4>
    <div class="d-flex gap-16 align-items-center">
      <div class="zenxius-search-wrapper">
        <i-tabler name="search" class="icon-18 search-icon"></i-tabler>
        <input type="text" placeholder="Search...." class="zenxius-search-input" (input)="applySearch($event)">
      </div>
      <button mat-flat-button color="primary" class="zenxius-btn-primary" (click)="openCreateDialog()">
        <span class="d-flex align-items-center">
          <i-tabler name="plus" class="icon-18 m-r-8"></i-tabler> Create Template
        </span>
      </button>
    </div>
  </div>

  <div class="p-0">
    <div class="table-container">
      <table mat-table [dataSource]="dataSource" class="w-100">

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="f-w-500 text-muted f-s-13" style="padding-left: 24px;"> Template Name </th>
          <td mat-cell *matCellDef="let element" class="mat-body-1 text-dark" style="padding-left: 24px;">
            <h6 class="mat-subtitle-1 f-s-14 f-w-500 m-b-0">{{element.name}}</h6>
          </td>
        </ng-container>

        <!-- Description Column -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef class="f-w-500 text-muted f-s-13"> Description </th>
          <td mat-cell *matCellDef="let element" class="text-muted f-s-13"> {{element.description || '-'}} </td>
        </ng-container>

        <!-- Document Count Column -->
        <ng-container matColumnDef="documentCount">
          <th mat-header-cell *matHeaderCellDef class="f-w-500 text-muted f-s-13"> Documents </th>
          <td mat-cell *matCellDef="let element">
            <span class="bg-light-primary text-primary rounded p-4 f-s-12 font-medium">
              {{element.documents?.length || 0}} Documents
            </span>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="f-w-500 text-muted f-s-13 text-right" style="padding-right: 24px;"> Actions </th>
          <td mat-cell *matCellDef="let element" class="text-right" style="padding-right: 24px;">
            <button mat-icon-button color="primary" (click)="openEditDialog(element)">
              <i-tabler name="edit" class="icon-18 d-flex"></i-tabler>
            </button>
            <button mat-icon-button color="warn" (click)="deleteTemplate(element.id)">
              <i-tabler name="trash" class="icon-18 d-flex"></i-tabler>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <!-- Empty State -->
      <div *ngIf="dataSource.data.length === 0" class="text-center p-y-24">
        <p class="text-muted m-0">No application templates found. Create one to get started.</p>
      </div>
    </div>
    
    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons class="zenxius-paginator"></mat-paginator>
  </div>
</div>
</div>
